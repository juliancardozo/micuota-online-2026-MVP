<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MiCuota</title>
    <meta name="robots" content="noindex,nofollow" />
    <link rel="icon" type="image/png" href="/assets/micuota-mate-mark.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/mc.css" />
    <script src="/micuota-config.js"></script>
    <script src="/app.js"></script>
  </head>
  <body>
    <!-- El panel de academias se retiro: MiCuota es una sola app para cualquier profesional. -->
    <main class="container narrow" style="padding-top:12vh">
      <div class="card center">
        <img src="/assets/micuota-mate-mark.png" alt="" width="56" height="56" />
        <h1 style="font-size:1.6rem;margin-top:12px">Esta sección ya no está disponible</h1>
        <p class="muted">Escribinos a <a href="mailto:hola@micuota.online">hola@micuota.online</a> y te ayudamos a pasar tu cuenta a la app de MiCuota.</p>
        <button class="btn btn-primary btn-lg btn-block" type="button" id="logout">Salir</button>
      </div>
    </main>
    <script>
      document.getElementById("logout").addEventListener("click", function () {
        window.MC.session.clear();
        location.href = "/cuenta.html#entrar";
      });
    </script>
  </body>
</html>
