spring.application.name=micuota-mvp-backend
server.port=${SERVER_PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

app.base-url=${APP_BASE_URL:http://localhost:8080}
app.frontend-base-url=${APP_FRONTEND_BASE_URL:${app.base-url}}

# Integraciones externas de links de pago (si estan desactivadas, usa sandbox interno)
app.payments.external-providers-enabled=${APP_PAYMENTS_EXTERNAL_PROVIDERS_ENABLED:false}
app.payments.default-provider=${APP_PAYMENTS_DEFAULT_PROVIDER:PROMETEO}
app.payments.fallback-provider=${APP_PAYMENTS_FALLBACK_PROVIDER:MERCADOPAGO}
app.payments.stripe.secret-key=
app.payments.square.access-token=
app.payments.square.location-id=
app.payments.square.use-sandbox=true
app.payments.mercadopago.base-url=${MERCADOPAGO_BASE_URL:https://api.mercadopago.com}
app.payments.mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}
# Marketplace: credenciales de la aplicacion de MiCuota en Mercado Pago. Con client-id y client-secret
# los profesores conectan su cuenta por OAuth y cada cobro lleva la comision de MiCuota (marketplace_fee).
app.payments.mercadopago.oauth.client-id=${MERCADOPAGO_CLIENT_ID:}
app.payments.mercadopago.oauth.client-secret=${MERCADOPAGO_CLIENT_SECRET:}
app.payments.mercadopago.oauth.redirect-uri=${MERCADOPAGO_OAUTH_REDIRECT_URI:${app.base-url}/api/mercadopago/oauth/callback}
app.payments.mercadopago.oauth.authorization-url=${MERCADOPAGO_OAUTH_AUTHORIZATION_URL:https://auth.mercadopago.com/authorization}
app.payments.sandbox-simulation-enabled=${APP_PAYMENTS_SANDBOX_SIMULATION_ENABLED:false}
app.payments.plexo.api-url=
app.payments.plexo.api-key=
app.crm.api-key=${APP_CRM_API_KEY:micuota-crm-dev-key}
app.crm.default-owner=${APP_CRM_DEFAULT_OWNER:ventas@micuota.online}
app.demo-seed.enabled=${APP_DEMO_SEED_ENABLED:false}
# Unico administrador de la plataforma (admin.html). Sin contraseña configurada no se crea.
app.platform-admin.email=${APP_PLATFORM_ADMIN_EMAIL:admin@micuota.online}
app.platform-admin.password=${APP_PLATFORM_ADMIN_PASSWORD:}
app.prometeo.enabled=${APP_PROMETEO_ENABLED:true}
app.prometeo.sandbox=${APP_PROMETEO_SANDBOX:true}
app.prometeo.base-url=${APP_PROMETEO_BASE_URL:https://account-validation.sandbox.prometeoapi.com}
app.prometeo.api-key=${APP_PROMETEO_API_KEY:}
app.prometeo.connect-timeout-ms=${APP_PROMETEO_CONNECT_TIMEOUT_MS:5000}
app.prometeo.read-timeout-ms=${APP_PROMETEO_READ_TIMEOUT_MS:15000}
# Pago desde el banco del cliente (Prometeo Banking API, MiCuota hace de proxy). Apagado hasta configurarlo.
app.prometeo.bank-payments-enabled=${APP_PROMETEO_BANK_PAYMENTS_ENABLED:false}
app.prometeo.banking-base-url=${APP_PROMETEO_BANKING_BASE_URL:https://banking.sandbox.prometeoapi.com}
app.prometeo.country=${APP_PROMETEO_COUNTRY:UY}
app.prometeo.sandbox-destination-institution=${APP_PROMETEO_SANDBOX_DESTINATION_INSTITUTION:012}
# Solo pruebas: en sandbox, el error 500 de Prometeo al confirmar se toma como pago simulado. Nunca en produccion.
app.prometeo.sandbox-simulate-confirm=${APP_PROMETEO_SANDBOX_SIMULATE_CONFIRM:false}
app.payments.dunning.cron=${APP_PAYMENTS_DUNNING_CRON:0 */30 * * * *}
app.payments.reconciliation.cron=${APP_PAYMENTS_RECONCILIATION_CRON:0 5 2 * * *}
app.mail.ops-alert=${APP_MAIL_OPS_ALERT:}

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# CORS para frontend estatico local / Netlify
app.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*,http://[::1]:*,https://micuota.online,https://www.micuota.online,https://*.netlify.app

# Mail: timeouts para que un SMTP bloqueado no cuelgue las requests; con Resend se manda por HTTPS (MailConfig).
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.resend-api-key=${RESEND_API_KEY:}
