<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MiCuota Admin</title>
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#0b6b4d" />
    <link rel="icon" type="image/png" href="/assets/micuota-mate-mark.png" />
    <link rel="apple-touch-icon" href="/assets/micuota-mate-mark.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/mc.css" />
    <link rel="stylesheet" href="/app.css" />
    <style>
      /* Panel de administracion: mas ancho que la app del profesor y con tabbar de 3 items. */
      .admin .view { max-width: 980px; }
      .admin .tabbar { grid-template-columns: repeat(3, 1fr); }
      .admin.is-logged-out .sidebar, .admin.is-logged-out .tabbar, .admin.is-logged-out .topbar-logout { display: none; }
      @media (min-width: 960px) { .admin.is-logged-out .app-shell { grid-template-columns: 1fr; } }
      .kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
      .kpis .value { font-size: clamp(1.8rem, 6vw, 2.2rem); }
      .money-lines { margin: 6px 0 0; padding: 0; list-style: none; font-weight: 700; }
      .bars { display: grid; gap: 10px; }
      .bar-row { display: grid; grid-template-columns: 64px 1fr auto; gap: 10px; align-items: center; font-size: var(--fs-sm); }
      .bar-track { height: 10px; border-radius: 99px; background: var(--bg-soft); overflow: hidden; }
      .bar-track > span { display: block; height: 100%; background: var(--brand); border-radius: 99px; }
      .account-card .facts { margin-top: 12px; }
      .fee-form { display: grid; gap: 10px; grid-template-columns: 1fr 1fr auto; align-items: end; margin-top: 14px; }
      .fee-form .field { margin: 0; }
      @media (max-width: 520px) { .fee-form { grid-template-columns: 1fr 1fr; } .fee-form .btn { grid-column: 1 / -1; } }
      .keep-list { display: grid; gap: 8px; margin-bottom: 16px; }
    </style>
    <script>
      try {
        var t = localStorage.getItem("micuota.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        if (localStorage.getItem("micuota.bigText") === "1") document.documentElement.classList.add("big-text");
      } catch (e) {}
    </script>
    <script src="/micuota-config.js"></script>
    <script src="/app.js"></script>
  </head>
  <body class="admin has-tabbar is-logged-out">
    <a class="skip-link" href="#view">Ir al contenido</a>

    <div class="app-shell">
      <aside class="sidebar" aria-label="Menú de administración">
        <a class="brand" href="#resumen"><img src="/assets/micuota-mate-mark.png" alt="" width="36" height="36" />MiCuota Admin</a>
        <nav class="side-nav">
          <a href="#resumen" data-nav="resumen"><span data-icon="home"></span>Resumen</a>
          <a href="#cuentas" data-nav="cuentas"><span data-icon="people"></span>Cuentas y comisiones</a>
          <a href="#mantenimiento" data-nav="mantenimiento"><span data-icon="refresh"></span>Mantenimiento</a>
        </nav>
        <div class="sidebar-foot">
          <p class="small muted" id="sidebar-user"></p>
          <button type="button" class="btn btn-sm btn-ghost" data-action="logout"><span data-icon="logout"></span>Cerrar sesión</button>
        </div>
      </aside>

      <div class="app-main">
        <header class="topbar">
          <a class="brand" href="#resumen"><img src="/assets/micuota-mate-mark.png" alt="" width="32" height="32" />Admin</a>
          <button type="button" class="btn btn-sm btn-ghost topbar-logout" data-action="logout" aria-label="Cerrar sesión"><span data-icon="logout"></span></button>
        </header>
        <main id="view" class="view" tabindex="-1" aria-live="polite">
          <div class="view-loading" aria-busy="true">
            <div class="skeleton" style="width:55%;height:2rem"></div>
            <div class="skeleton" style="width:100%;height:140px;margin-top:20px;border-radius:20px"></div>
            <p class="muted center">Cargando…</p>
          </div>
        </main>
      </div>
    </div>

    <nav class="tabbar" aria-label="Menú de administración">
      <a href="#resumen" data-nav="resumen"><span data-icon="home"></span>Resumen</a>
      <a href="#cuentas" data-nav="cuentas"><span data-icon="people"></span>Cuentas</a>
      <a href="#mantenimiento" data-nav="mantenimiento"><span data-icon="refresh"></span>Limpieza</a>
    </nav>

    <script src="/admin.js"></script>
  </body>
</html>
